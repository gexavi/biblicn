services:
  bibliotheque:
    build: .
    container_name: bibliotheque
    restart: unless-stopped
    ports:
      - "7000:3000"
    environment:
      # Identifiant/mot de passe de connexion à l'application (accès unique,
      # partagé par tout le foyer). Définissez AUTH_USERNAME/AUTH_PASSWORD
      # dans l'onglet "Environment variables" de Portainer (ou un fichier
      # .env à côté de ce docker-compose.yml) — ne les codez pas ici en dur.
      - AUTH_USERNAME=${AUTH_USERNAME:?AUTH_USERNAME manquant}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?AUTH_PASSWORD manquant}
    volumes:
      # Chemin absolu obligatoire (Portainer gère mal les chemins relatifs
      # comme ./data) — adaptez si votre dossier NAS est différent.
      - /volume1/docker/bibliotheque/data:/app/data
